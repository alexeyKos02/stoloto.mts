name: "Diff XLSX"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим сравнения"
        required: true
        type: choice
        default: "post-sync"
        options:
          - post-sync
          - pre-sync

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install openpyxl requests

      - name: Run diff
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          DISK_SOURCE_PATH: ${{ secrets.DISK_SOURCE_PATH }}
          DISK_TARGET_PATH: ${{ secrets.DISK_TARGET_PATH }}
        run: python diff_xlsx.py --mode ${{ inputs.mode }}
